name: CI

on:
  push:
  pull_request:

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The project ships Windows .bat, macOS .command and Linux .sh launchers and
  # supports 3.10+, but CI only ever ran 3.12 on Linux. The legs below are an
  # explicit include rather than a 3x3 product: the combinations that are not
  # listed add cost without covering anything the listed ones miss.
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # one red leg must not hide the state of the others
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}   # the documented floor
          - {os: ubuntu-latest, python: "3.12"}   # what the Docker image runs
          - {os: ubuntu-latest, python: "3.14"}   # what development runs
          - {os: windows-latest, python: "3.12"}  # os.chmod is a no-op, paths differ
          - {os: windows-latest, python: "3.14"}
          - {os: macos-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Run tests
        run: python -m pytest -q

  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      # All of corparius/ at the default level. The next ratchet is strictness
      # (disallow_untyped_defs), scoped per-module in pyproject.toml.
      #
      # Both platforms, because mypy analyses only the branches that apply to
      # the one it targets. corparius reads memory through ctypes.windll on
      # Windows and os.sysconf elsewhere, and each attribute exists in exactly
      # one set of stubs: a Linux-only run passes code that fails on a
      # developer's Windows machine, and this runner had been letting the
      # reverse through until it did not.
      - name: Types
        run: mypy corparius/
      - name: Types (windows stubs)
        run: mypy --platform win32 corparius/
      - name: Coverage
        run: |
          coverage run -m pytest -q
          coverage report --fail-under=72
          # The total is necessary and not sufficient: one number cannot see a module
          # going from 88% to 30% while the average holds, which is exactly what a
          # restructuring does when a large file splits and only some of its tests
          # follow. Each file carries its own floor in tests/coverage-baseline.json.
          coverage json
          python packaging/coverage_ratchet.py

  # Catch a broken PyInstaller spec / frozen-path regression on every PR, before
  # a release tag depends on it. One cheap Linux build + offline smoke; the full
  # OS matrix runs in release.yml on a tag.
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and PyInstaller
        run: pip install -r requirements-dev.txt
      # The console is built here, never at runtime. The spec picks up
      # corparius/api/static/ only if it exists, so this step is what puts /app/ in the binary.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the console
        run: npm ci --prefix web && npm run build --prefix web
      # Its own process: the example plugin registers into the shared provider
      # registries, which is why testpaths keeps it out of the main suite.
      - name: Validate the plugin template
        run: python -m pytest packaging/plugin-template -q
        env:
          PYTHONPATH: .:packaging/plugin-template
      - name: Build the binary
        run: pyinstaller packaging/corparius.spec --noconfirm
      - name: Smoke test (offline mock console)
        run: |
          set -euo pipefail
          ./dist/corparius --no-browser &
          pid=$!
          ok=""
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8600/api/companies >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "${ok:-}" != "1" ]; then echo "console did not come up"; kill "$pid" 2>/dev/null || true; exit 1; fi
          curl -fsS http://127.0.0.1:8600/api/companies | grep -q '"example"'
          curl -fsS http://127.0.0.1:8600/api/doctor    | grep -q 'mock'
          curl -fsS http://127.0.0.1:8600/api/update    | grep -q '"enabled": false'
          # Every sub-package imports in the frozen binary, proved in one request. `capabilities`
          # resolves from `providers` (models, mail), `config` (payments, plugins, secrets) and
          # `store` (the schema stamp the database is actually at), so a lazy import broken by
          # PyInstaller's analysis fails here rather than the first time an operator clicks.
          meta=$(curl -fsS http://127.0.0.1:8600/api/v1/meta)
          echo "$meta" | grep -q '"api_version": 1'
          echo "$meta" | grep -q '"schema_version": '
          echo "$meta" | grep -q '"models": true'   # mock mode is a capability, not its absence
          # A narrow resource and its validator, which is the second half of the contract: the
          # ETag has to be issued and honoured, and a 304 is what proves the branch runs in the
          # frozen build rather than only under pytest.
          tag=$(curl -fsS -D - -o /dev/null "http://127.0.0.1:8600/api/v1/summary?company=example" \
                | tr -d '\r' | awk 'tolower($1) == "etag:" { print $2 }')
          test -n "$tag" || { echo "no ETag on a v1 resource"; kill "$pid" 2>/dev/null; exit 1; }
          code=$(curl -fsS -o /dev/null -w '%{http_code}' -H "If-None-Match: $tag" \
                 "http://127.0.0.1:8600/api/v1/summary?company=example")
          test "$code" = "304" || { echo "unchanged summary answered $code, not 304"; kill "$pid" 2>/dev/null; exit 1; }
          # And the v1 envelope, which a second client branches on. No `-f` here on purpose: the
          # response *is* a 404 and `-f` would make curl discard the body we came to read.
          curl -sS "http://127.0.0.1:8600/api/v1/summary?company=nope" \
            | grep -q '"code": "unknown_company"'
          # Durable work, and the header that keeps a retry from doubling it. Two identical POSTs
          # with one Idempotency-Key have to answer with one job — the second saying created:false
          # — which is the promise a client on a bad connection depends on.
          one=$(curl -sS -X POST -H 'Content-Type: application/json' -H 'Idempotency-Key: smoke-1' \
                -d '{"company":"example","ticks":1}' http://127.0.0.1:8600/api/v1/runs)
          two=$(curl -sS -X POST -H 'Content-Type: application/json' -H 'Idempotency-Key: smoke-1' \
                -d '{"company":"example","ticks":1}' http://127.0.0.1:8600/api/v1/runs)
          echo "$one" | grep -q '"created": true'
          echo "$two" | grep -q '"created": false'
          test "$(echo "$one" | grep -o '"job": "[a-f0-9]*"')" = "$(echo "$two" | grep -o '"job": "[a-f0-9]*"')" \
            || { echo "one key answered with two jobs"; kill "$pid" 2>/dev/null; exit 1; }
          curl -fsS "http://127.0.0.1:8600/api/v1/jobs?company=example" | grep -q '"kind": "run"'
          # The built console, inside the frozen bundle. `paths.console_dir()` resolves under
          # sys._MEIPASS here and nowhere else, so this is the only place that mode is exercised —
          # and a resource missing from a PyInstaller spec is invisible until someone runs the
          # binary.
          curl -fsS http://127.0.0.1:8600/app/ | grep -q '<div id="app">'
          curl -fsS http://127.0.0.1:8600/app/console.js  > /dev/null
          curl -fsS http://127.0.0.1:8600/app/console.css > /dev/null
          echo "smoke OK: console up, example seeded, mock mode, update-check off, v1 meta + ETag/304, /app/ served"
          kill "$pid" 2>/dev/null || true

  # Build the wheel, install it into a clean environment, and run it from a
  # neutral directory so nothing shadows the installed package. This guards the
  # installed-mode resource resolution (webui.html, the example company and the
  # plugin registry ride inside the wheel; state must land off site-packages).
  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # The console is built here and nowhere at runtime. `npm run build` writes into
      # corparius/api/static/, which the wheel then carries — so the installed package serves it
      # with no Node present, which the step below is what proves.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the console
        run: npm ci --prefix web && npm run build --prefix web
      - name: Build the wheel
        run: pip install build && python -m build --wheel
      - name: Install into a clean venv and run
        run: |
          set -euo pipefail
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          cd /tmp   # neutral cwd: the checkout's corparius/ must not shadow the install
          export CORP_HOME=/tmp/corp-home CORP_LLM_MOCK=true
          /tmp/venv/bin/python - <<'PY'
          from corparius.kernel import paths
          from corparius import __file__ as f
          assert "site-packages" in f, f
          assert not paths._is_source_checkout()
          assert paths.page_file().is_file()
          assert (paths.example_company_src() / "company.yaml").is_file()
          assert paths.plugin_registry_file().is_file()
          assert "site-packages" not in str(paths.user_home())
          # The built console rides inside the wheel, at corparius/api/static/. This is the mode
          # where getting it wrong is hardest to notice from a checkout, and the whole reason the
          # build writes inside the package rather than beside it.
          assert paths.console_built(), paths.console_dir()
          assert (paths.console_dir() / "console.js").is_file()
          print("installed-mode resources OK, console included")
          PY
          /tmp/venv/bin/corparius run --company example --ticks 4 | grep -q '"ticks_run": 4'
          # And it serves the built console with **no Node installed anywhere** — the promise the
          # plan makes explicitly, and the reason the front-end build is a CI step and not a
          # runtime one. `which node` is asserted absent rather than assumed: the runner has Node
          # for the build job, and a venv that inherited it would make this pass for the wrong
          # reason.
          /tmp/venv/bin/corparius ui --port 8611 --host 127.0.0.1 &
          pid=$!
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8611/api/session >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8611/app/ | grep -q '<div id="app">'
          curl -fsS http://127.0.0.1:8611/app/console.js > /dev/null
          kill "$pid" 2>/dev/null || true
          echo "wheel smoke OK: installed package runs a day offline and serves /app/"
