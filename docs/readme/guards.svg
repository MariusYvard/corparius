<svg viewBox="0 0 1200 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="three automatic guards in front of every agent turn — a token budget, a loop guard and a circuit breaker — and then the human gate, where money and production code wait for the operator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF2F9"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#B7C2D8"/></pattern>
    <radialGradient id="dm" cx="0.2" cy="-0.05" r="1.05"><stop offset="0.3" stop-color="#fff"/><stop offset="0.75" stop-color="#000"/></radialGradient>
    <mask id="fade"><rect width="1200" height="356" fill="url(#dm)"/></mask>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#9AA9C6" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1200" height="356" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="356" fill="url(#dots)" opacity="0.5" mask="url(#fade)"/>
  <text x="36" y="42" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#2456D3">EVERY TURN PASSES THREE GUARDS, THEN STOPS AT YOU</text>
<rect x="36" y="84" width="268" height="150" rx="12" fill="#FFFFFF" stroke="#CAD1DF" stroke-width="1.3"/><text x="54" y="116" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="16.5" font-weight="700" fill="#142752">TokenBudget</text><text x="54" y="140" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#2456D3">a hard ceiling per session</text><text x="54" y="168" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#475572">checked before each call,</text><text x="54" y="187" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#475572">updated after</text><path d="M304 159.0 L322 159.0" stroke="#9AA9C6" stroke-width="1.6" marker-end="url(#ah)"/><rect x="326" y="84" width="268" height="150" rx="12" fill="#FFFFFF" stroke="#CAD1DF" stroke-width="1.3"/><text x="344" y="116" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="16.5" font-weight="700" fill="#142752">LoopGuard</text><text x="344" y="140" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#2456D3">semantic stutter, and repeats</text><text x="344" y="168" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#475572">cosine over the last outputs,</text><text x="344" y="187" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#475572">identical tool calls counted</text><path d="M594 159.0 L612 159.0" stroke="#9AA9C6" stroke-width="1.6" marker-end="url(#ah)"/><rect x="616" y="84" width="268" height="150" rx="12" fill="#FFFFFF" stroke="#CAD1DF" stroke-width="1.3"/><text x="634" y="116" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="16.5" font-weight="700" fill="#142752">CircuitBreaker</text><text x="634" y="140" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#2456D3">spend velocity</text><text x="634" y="168" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#475572">a sustained burst trips</text><text x="634" y="187" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#475572">NORMAL → CONSERVATIVE → SAFE</text><path d="M884 159.0 L902 159.0" stroke="#9AA9C6" stroke-width="1.6" marker-end="url(#ah)"/><rect x="906" y="84" width="258" height="150" rx="12" fill="#FFFFFF" stroke="#AA5900" stroke-width="1.3"/><rect x="906" y="84" width="258" height="150" rx="12" fill="#AA5900" opacity="0.07"/><circle cx="1140" cy="108" r="5" fill="#AA5900"/><text x="924" y="116" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="16.5" font-weight="700" fill="#142752">Human gate</text><text x="924" y="140" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#AA5900">money · production code</text><text x="924" y="168" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#475572">the request waits with what</text><text x="924" y="187" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#475572">it will do and the values it</text><text x="924" y="206" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#475572">will run with. A rejection is</text><text x="924" y="225" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#475572">handed back as a tool error.</text><rect x="36" y="260" width="1128" height="52" rx="12" fill="#F3F6FB" stroke="#CAD1DF" stroke-width="1.3"/><text x="56" y="291" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13.5" fill="#475572">An autonomous agent alone with an API key and a card is a runaway-cost incident waiting to happen. These are what make it not one.</text></svg>
