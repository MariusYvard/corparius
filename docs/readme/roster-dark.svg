<svg viewBox="0 0 1200 608" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="the ten agents and when each runs across a day. CEO every 6h from 00h; Social every 8h from 03h; Outreach every 6h from 04h, held until the company has site; Support every 3h from 02h, held until the company has mail; Ads every 24h from 09h, held until the company has site and payment; Finance every 12h from 05h, held until the company has payment; Strategy every 24h from 07h; Competitor every 24h from 13h; Design every 8h from 01h; Coder on demand">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#081A3E"/><stop offset="1" stop-color="#061232"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#537CD6"/></pattern>
    <radialGradient id="dm" cx="0.2" cy="-0.05" r="1.05"><stop offset="0.3" stop-color="#fff"/><stop offset="0.75" stop-color="#000"/></radialGradient>
    <mask id="fade"><rect width="1200" height="608" fill="url(#dm)"/></mask>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#537CD6" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1200" height="608" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="608" fill="url(#dots)" opacity="0.16" mask="url(#fade)"/>
  <text x="36" y="42" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#8CCBFF">THE ROSTER · TEN ROLES, STAGGERED</text>
<text x="430.0" y="82" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="middle" fill="#9AA5BB">00h</text><line x1="430.0" y1="90" x2="430.0" y2="578" stroke="#254387" stroke-width="1" opacity="0.45"/><text x="565.0" y="82" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="middle" fill="#9AA5BB">06h</text><line x1="565.0" y1="90" x2="565.0" y2="578" stroke="#254387" stroke-width="1" opacity="0.45"/><text x="700.0" y="82" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="middle" fill="#9AA5BB">12h</text><line x1="700.0" y1="90" x2="700.0" y2="578" stroke="#254387" stroke-width="1" opacity="0.45"/><text x="835.0" y="82" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="middle" fill="#9AA5BB">18h</text><line x1="835.0" y1="90" x2="835.0" y2="578" stroke="#254387" stroke-width="1" opacity="0.45"/><text x="970.0" y="82" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="middle" fill="#9AA5BB">24h</text><line x1="970.0" y1="90" x2="970.0" y2="578" stroke="#254387" stroke-width="1" opacity="0.45"/><text x="60" y="130" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#EFF4FC">CEO</text><text x="160" y="130" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#9AA5BB">orchestrator · owns the backlog</text><line x1="430" y1="125" x2="970" y2="125" stroke="#254387" stroke-width="1"/><circle cx="430.0" cy="125" r="4.5" fill="#EB933B"/><circle cx="565.0" cy="125" r="4.5" fill="#EB933B"/><circle cx="700.0" cy="125" r="4.5" fill="#EB933B"/><circle cx="835.0" cy="125" r="4.5" fill="#EB933B"/><text x="60" y="176" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#EFF4FC">Social</text><text x="160" y="176" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#9AA5BB">drafts and schedules posts</text><line x1="430" y1="171" x2="970" y2="171" stroke="#254387" stroke-width="1"/><circle cx="497.5" cy="171" r="4.5" fill="#2456D3"/><circle cx="677.5" cy="171" r="4.5" fill="#2456D3"/><circle cx="857.5" cy="171" r="4.5" fill="#2456D3"/><text x="60" y="222" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#EFF4FC">Outreach</text><text x="160" y="222" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#9AA5BB">finds targets, sends, tracks replies</text><line x1="430" y1="217" x2="970" y2="217" stroke="#254387" stroke-width="1"/><circle cx="520.0" cy="217" r="4.5" fill="#2456D3"/><circle cx="655.0" cy="217" r="4.5" fill="#2456D3"/><circle cx="790.0" cy="217" r="4.5" fill="#2456D3"/><circle cx="925.0" cy="217" r="4.5" fill="#2456D3"/><text x="994" y="222" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#EB933B">needs site</text><text x="60" y="268" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#EFF4FC">Support</text><text x="160" y="268" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#9AA5BB">triages the inbox, drafts replies</text><line x1="430" y1="263" x2="970" y2="263" stroke="#254387" stroke-width="1"/><circle cx="475.0" cy="263" r="4.5" fill="#2456D3"/><circle cx="542.5" cy="263" r="4.5" fill="#2456D3"/><circle cx="610.0" cy="263" r="4.5" fill="#2456D3"/><circle cx="677.5" cy="263" r="4.5" fill="#2456D3"/><circle cx="745.0" cy="263" r="4.5" fill="#2456D3"/><circle cx="812.5" cy="263" r="4.5" fill="#2456D3"/><circle cx="880.0" cy="263" r="4.5" fill="#2456D3"/><circle cx="947.5" cy="263" r="4.5" fill="#2456D3"/><text x="994" y="268" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#EB933B">needs mail</text><text x="60" y="314" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#EFF4FC">Ads</text><text x="160" y="314" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#9AA5BB">budgets, variants, bids</text><line x1="430" y1="309" x2="970" y2="309" stroke="#254387" stroke-width="1"/><circle cx="632.5" cy="309" r="4.5" fill="#2456D3"/><text x="994" y="314" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#EB933B">needs site + payment</text><text x="60" y="360" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#EFF4FC">Finance</text><text x="160" y="360" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#9AA5BB">reconciles Stripe, tracks spend</text><line x1="430" y1="355" x2="970" y2="355" stroke="#254387" stroke-width="1"/><circle cx="542.5" cy="355" r="4.5" fill="#2456D3"/><circle cx="812.5" cy="355" r="4.5" fill="#2456D3"/><text x="994" y="360" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#EB933B">needs payment</text><text x="60" y="406" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#EFF4FC">Strategy</text><text x="160" y="406" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#9AA5BB">reads KPIs, prices, roadmap</text><line x1="430" y1="401" x2="970" y2="401" stroke="#254387" stroke-width="1"/><circle cx="587.5" cy="401" r="4.5" fill="#64B8D2"/><text x="60" y="452" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#EFF4FC">Competitor</text><text x="160" y="452" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#9AA5BB">researches, updates profiles</text><line x1="430" y1="447" x2="970" y2="447" stroke="#254387" stroke-width="1"/><circle cx="722.5" cy="447" r="4.5" fill="#64B8D2"/><text x="60" y="498" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#EFF4FC">Design</text><text x="160" y="498" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#9AA5BB">visual direction, builds the site</text><line x1="430" y1="493" x2="970" y2="493" stroke="#254387" stroke-width="1"/><circle cx="452.5" cy="493" r="4.5" fill="#64B8D2"/><circle cx="632.5" cy="493" r="4.5" fill="#64B8D2"/><circle cx="812.5" cy="493" r="4.5" fill="#64B8D2"/><text x="60" y="544" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#EFF4FC">Coder</text><text x="160" y="544" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#9AA5BB">features, fixes, pull requests</text><text x="430" y="544" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#9AA5BB">on demand, when the CEO files a task</text></svg>
