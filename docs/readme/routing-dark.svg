<svg viewBox="0 0 1200 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="the three difficulty tiers each map to a provider target, and a failed call walks the fallback chain in order until it reaches the local model, which needs no network">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#081A3E"/><stop offset="1" stop-color="#061232"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#537CD6"/></pattern>
    <radialGradient id="dm" cx="0.2" cy="-0.05" r="1.05"><stop offset="0.3" stop-color="#fff"/><stop offset="0.75" stop-color="#000"/></radialGradient>
    <mask id="fade"><rect width="1200" height="372" fill="url(#dm)"/></mask>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#537CD6" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1200" height="372" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="372" fill="url(#dots)" opacity="0.16" mask="url(#fade)"/>
  <text x="36" y="42" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#8CCBFF">ROUTING · THREE TIERS, ONE CHAIN, ALWAYS A WAY HOME</text>
<rect x="36" y="82" width="470" height="50" rx="12" fill="#0A1D48" stroke="#254387" stroke-width="1.3"/><text x="54" y="113" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#9AA5BB">CORP_TRIVIAL_MODEL</text><rect x="370" y="95" width="61" height="23" rx="11.5" fill="none" stroke="#70BF5C" stroke-width="1"/><text x="400.5" y="111" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle" fill="#70BF5C">trivial</text><path d="M506 107 L560 107" stroke="#537CD6" stroke-width="1.6" marker-end="url(#ah)"/><rect x="572" y="82" width="592" height="50" rx="12" fill="#0A1D48" stroke="#70BF5C" stroke-width="1.3"/><text x="590" y="113" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13.5" fill="#EFF4FC">local:gemma4:e4b</text><rect x="36" y="144" width="470" height="50" rx="12" fill="#0A1D48" stroke="#254387" stroke-width="1.3"/><text x="54" y="175" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#9AA5BB">CORP_NORMAL_MODEL</text><rect x="370" y="157" width="54" height="23" rx="11.5" fill="none" stroke="#2456D3" stroke-width="1"/><text x="397.0" y="173" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle" fill="#2456D3">normal</text><path d="M506 169 L560 169" stroke="#537CD6" stroke-width="1.6" marker-end="url(#ah)"/><rect x="572" y="144" width="592" height="50" rx="12" fill="#0A1D48" stroke="#2456D3" stroke-width="1.3"/><text x="590" y="175" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13.5" fill="#EFF4FC">groq:llama-3.3-70b-versatile</text><rect x="36" y="206" width="470" height="50" rx="12" fill="#0A1D48" stroke="#254387" stroke-width="1.3"/><text x="54" y="237" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#9AA5BB">CORP_HARD_MODEL</text><rect x="370" y="219" width="40" height="23" rx="11.5" fill="none" stroke="#64B8D2" stroke-width="1"/><text x="390.0" y="235" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle" fill="#64B8D2">hard</text><path d="M506 231 L560 231" stroke="#537CD6" stroke-width="1.6" marker-end="url(#ah)"/><rect x="572" y="206" width="592" height="50" rx="12" fill="#0A1D48" stroke="#64B8D2" stroke-width="1.3"/><text x="590" y="237" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13.5" fill="#EFF4FC">openrouter:deepseek/deepseek-r1-0528:free</text><rect x="36" y="282" width="1128" height="86" rx="12" fill="#061634" stroke="#254387" stroke-width="1.3"/><text x="56" y="310" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#EFF4FC">When a remote call fails</text><text x="56" y="332" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#9AA5BB">rate limit, outage, a model that cannot answer</text><rect x="560" y="314" width="40" height="23" rx="11.5" fill="none" stroke="#2456D3" stroke-width="1"/><text x="580.0" y="330" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle" fill="#2456D3">groq</text><path d="M606.0 325 L626.0 325" stroke="#537CD6" stroke-width="1.4" marker-end="url(#ah)"/><rect x="634.0" y="314" width="68" height="23" rx="11.5" fill="none" stroke="#2456D3" stroke-width="1"/><text x="668.0" y="330" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle" fill="#2456D3">cerebras</text><path d="M708.0 325 L728.0 325" stroke="#537CD6" stroke-width="1.4" marker-end="url(#ah)"/><rect x="736.0" y="314" width="61" height="23" rx="11.5" fill="none" stroke="#2456D3" stroke-width="1"/><text x="766.5" y="330" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle" fill="#2456D3">mistral</text><path d="M803.0 325 L823.0 325" stroke="#537CD6" stroke-width="1.4" marker-end="url(#ah)"/><rect x="831.0" y="314" width="117" height="23" rx="11.5" fill="none" stroke="#70BF5C" stroke-width="1"/><text x="889.5" y="330" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle" fill="#70BF5C">local · offline</text><text x="56" y="356" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#9AA5BB">A provider that refuses goes to the end of the chain rather than being dropped, and comes back once it is rested.</text></svg>
