<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="plugins add code, skills add prose, documents are the files it already has, and apps are what it runs for its own visitors">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF2F9"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#B7C2D8"/></pattern>
    <radialGradient id="dm" cx="0.2" cy="-0.05" r="1.05"><stop offset="0.3" stop-color="#fff"/><stop offset="0.75" stop-color="#000"/></radialGradient>
    <mask id="fade"><rect width="1200" height="300" fill="url(#dm)"/></mask>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#9AA9C6" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)" opacity="0.5" mask="url(#fade)"/>
  <text x="36" y="42" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#2456D3">FOUR WAYS TO TEACH A COMPANY</text>
<rect x="36" y="84" width="267" height="172" rx="12" fill="#FFFFFF" stroke="#CAD1DF" stroke-width="1.3"/><text x="54" y="118" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#142752">Plugins</text><rect x="54" y="132" width="40" height="23" rx="11.5" fill="none" stroke="#2456D3" stroke-width="1"/><text x="74.0" y="148" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle" fill="#2456D3">code</text><text x="54" y="184" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#475572">providers, tools, templates,</text><text x="54" y="203" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#475572">without touching the core</text><text x="54" y="236" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#2456D3">plugins/registry.json</text><rect x="323" y="84" width="267" height="172" rx="12" fill="#FFFFFF" stroke="#CAD1DF" stroke-width="1.3"/><text x="341" y="118" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#142752">Skills</text><rect x="341" y="132" width="47" height="23" rx="11.5" fill="none" stroke="#2E7D96" stroke-width="1"/><text x="364.5" y="148" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle" fill="#2E7D96">prose</text><text x="341" y="184" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#475572">the objection your market raises,</text><text x="341" y="203" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#475572">the price you never discount below</text><text x="341" y="236" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#2E7D96">SKILL.md</text><rect x="610" y="84" width="267" height="172" rx="12" fill="#FFFFFF" stroke="#CAD1DF" stroke-width="1.3"/><text x="628" y="118" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#142752">Documents</text><rect x="628" y="132" width="47" height="23" rx="11.5" fill="none" stroke="#3F7A31" stroke-width="1"/><text x="651.5" y="148" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle" fill="#3F7A31">files</text><text x="628" y="184" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#475572">the deck, the spec, the price list:</text><text x="628" y="203" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#475572">read with the standard library</text><text x="628" y="236" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#3F7A31">documents/</text><rect x="897" y="84" width="267" height="172" rx="12" fill="#FFFFFF" stroke="#CAD1DF" stroke-width="1.3"/><text x="915" y="118" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#142752">Apps</text><rect x="915" y="132" width="61" height="23" rx="11.5" fill="none" stroke="#AA5900" stroke-width="1"/><text x="945.5" y="148" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" text-anchor="middle" fill="#AA5900">its own</text><text x="915" y="184" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#475572">a FAQ on the sales site, a form</text><text x="915" y="203" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#475572">that understands what a visitor wrote</text><text x="915" y="236" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#AA5900">apps/*.yaml</text></svg>
